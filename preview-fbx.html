<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBX preview — STA breathing idle</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a0f;
            font-family: system-ui, sans-serif;
        }
        #status {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 1;
            color: #c8c8d8;
            font-size: 14px;
            text-shadow: 0 0 8px #000;
            max-width: min(90vw, 420px);
        }
        #hint {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 1;
            color: #8888a0;
            font-size: 12px;
            text-shadow: 0 0 8px #000;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="status">Loading assets/player_STA_Breathing_Idle.fbx…</div>
    <div id="hint">Drag to orbit · scroll to zoom</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        const statusEl = document.getElementById('status');
        const FBX_PATH = 'assets/player_STA_Breathing_Idle.fbx';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);
        camera.position.set(2, 1.6, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.85));
        const dir = new THREE.DirectionalLight(0xffffff, 0.7);
        dir.position.set(4, 10, 6);
        scene.add(dir);

        const grid = new THREE.GridHelper(10, 20, 0x464664, 0x2a2a38);
        grid.position.y = 0;
        scene.add(grid);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.9, 0);

        const clock = new THREE.Clock();
        let mixer = null;

        new FBXLoader().load(
            FBX_PATH,
            (object) => {
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                object.position.sub(center);

                scene.add(object);

                if (object.animations && object.animations.length) {
                    mixer = new THREE.AnimationMixer(object);
                    for (const clip of object.animations) {
                        mixer.clipAction(clip).play();
                    }
                    statusEl.textContent = `Loaded — ${object.animations.length} animation clip(s). Playing all.`;
                } else {
                    statusEl.textContent = 'Loaded — no animation clips in file (static mesh).';
                }

                const maxDim = Math.max(size.x, size.y, size.z, 0.001);
                const dist = maxDim * 2.2;
                camera.position.set(dist * 0.7, maxDim * 0.9, dist * 0.9);
                controls.target.set(0, maxDim * 0.45, 0);
                controls.update();
            },
            undefined,
            (err) => {
                console.error(err);
                statusEl.textContent = 'Failed to load FBX. Use run_game.bat (or python -m http.server) and open this page from http://127.0.0.1 — not file://';
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if (mixer) mixer.update(dt);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
